[project]
name = "interviewos-backend"
version = "0.8.1"
description = "InterviewOS backend API service"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.116.1",
    "uvicorn[standard]==0.35.0",
    "sqlalchemy[asyncio]==2.0.43",
    "asyncpg==0.30.0",
    "alembic==1.16.5",
    "pydantic==2.11.7",
    "pydantic-settings==2.10.1",
    "httpx==0.28.1",
    "redis==6.4.0",
    "prometheus-client>=0.26.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "aiosqlite>=0.20",
]

[tool.uv]
package = false
# Pin the registry at project level (overrides the user-level mirror in
# %APPDATA%\uv\uv.toml): uv.lock bakes index URLs into every package entry,
# so a China-mirror lock intermittently 403s on GitHub's US CI runners.
# pypi.org stays reachable from China; uv's local cache absorbs re-syncs.
[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true
