[pytest]
testpaths = tests
# Dedicated basetemp inside the repo: pytest's default temp layout creates a
# `pytest-current` symlink under the system temp dir, which is unusable on
# some locked-down Windows environments (WinError 5 on stat/unlink).
addopts = -q --basetemp=.pytest-tmp
filterwarnings =
    # Third-party: starlette 0.116's TestClient module-level import of
    # anyio.abc.BlockingPortal. Fixed upstream; nothing in this codebase
    # uses anyio directly. Narrow message match keeps other anyio
    # deprecations visible.
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning
